<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space Garden">
<meta name="theme-color" content="#050510">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Space Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; color: #fff;
    background: radial-gradient(ellipse at center, #11113a 0%, #050510 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
  }
  :root { --big: 72px; --fb: 56px; }
  @media (max-width: 600px) { :root { --big: 58px; --fb: 46px; } }

  #sky, #space { position: absolute; inset: 0; overflow: hidden; }
  #space { transition: opacity .6s; }
  body.landed #space { opacity: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff;
          animation: twinkle var(--d) ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }

  .ring { position: absolute; border: 1px dashed rgba(255,255,255,.13); border-radius: 50%;
          transform: translate(-50%, -50%); pointer-events: none; }

  #sun { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5;
         background: radial-gradient(circle at 40% 40%, #fff9c4 0%, #ffd54f 35%, #ff9800 70%, #e65100 100%);
         box-shadow: 0 0 60px #ffb300, 0 0 120px rgba(255,152,0,.6);
         animation: sunGlow 4s ease-in-out infinite; }
  @keyframes sunGlow { 50% { box-shadow: 0 0 90px #ffd54f, 0 0 180px rgba(255,152,0,.85); } }

  /* Anything that moves around the screen */
  .body { position: absolute; left: 0; top: 0; will-change: transform; z-index: 6; }
  .body::before { content: ''; position: absolute; inset: -14px; border-radius: 50%; } /* bigger tap area */
  .inner { position: relative; width: 100%; height: 100%; }
  .boop { animation: boop .45s ease; }
  @keyframes boop { 40% { transform: scale(1.4); } }

  .ball { width: 100%; height: 100%; border-radius: 50%;
          box-shadow: inset -5px -5px 12px rgba(0,0,0,.5), 0 0 12px rgba(255,255,255,.15); }
  .sring { position: absolute; left: 50%; top: 50%; width: 230%; height: 55%;
           border: 3px solid rgba(235,205,145,.85); border-radius: 50%;
           transform: translate(-50%, -50%) rotate(-18deg); pointer-events: none; }
  .label { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px;
           font-size: 10px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
           color: rgba(255,255,255,.55); pointer-events: none; }
  /* Quiz hint: the planet we're looking for glows */
  .glow .ball { animation: glow .8s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: inset -5px -5px 12px rgba(0,0,0,.5), 0 0 18px 8px #fff, 0 0 40px 16px #7ab8ff; } }

  .fruit { z-index: 7; }
  .fruit .inner { display: flex; align-items: center; justify-content: center; line-height: 1;
                  filter: drop-shadow(0 0 6px rgba(255,255,255,.35)); }

  .meteor { z-index: 8; font-size: 34px; line-height: 1; }
  .meteor.burst { animation: burst .4s ease forwards; }
  @keyframes burst { to { opacity: 0; font-size: 70px; } }

  #ufo { z-index: 8; font-size: 52px; line-height: 1; display: none; }
  #flyer { z-index: 15; font-size: 46px; line-height: 1; display: none; pointer-events: none;
           transition: opacity .5s; }
  #confetti { position: absolute; inset: 0; z-index: 28; pointer-events: none; }

  /* ---------- Planet surface (after landing) ---------- */
  #surface { position: absolute; inset: 0; z-index: 18; opacity: 0; pointer-events: none; transition: opacity .6s;
             background: linear-gradient(to bottom, rgba(5,5,16,.15) 0%, var(--sky, #20103a) 75%); }
  #surface.show { opacity: 1; pointer-events: auto; }
  #ground { position: absolute; left: -20%; right: -20%; bottom: 0; border-radius: 50% 50% 0 0 / 70px 70px 0 0;
            background:
              radial-gradient(circle at 22% 28%, rgba(0,0,0,.18) 0 3%, transparent 3.5%),
              radial-gradient(circle at 72% 50%, rgba(0,0,0,.15) 0 2.5%, transparent 3%),
              radial-gradient(circle at 46% 18%, rgba(255,255,255,.12) 0 2%, transparent 2.5%),
              radial-gradient(circle at 86% 22%, rgba(0,0,0,.12) 0 2%, transparent 2.5%),
              linear-gradient(to bottom, var(--ground, #888), var(--ground2, #444));
            box-shadow: 0 -8px 40px var(--ground, #888); }
  #plots { position: absolute; left: 0; right: 0; display: flex; justify-content: space-evenly; align-items: flex-end; }
  .plot { position: relative; display: flex; align-items: flex-end; justify-content: center; }
  .mound { position: absolute; bottom: 0; left: 4%; right: 4%; height: 28%; border-radius: 50% 50% 45% 45%;
           background: radial-gradient(ellipse at 50% 30%, #8d6e63, #4e342e); box-shadow: inset 0 -4px 8px rgba(0,0,0,.4); }
  .plant { position: relative; bottom: 14%; line-height: 1; transform-origin: 50% 100%; pointer-events: none;
           transform: scale(var(--s, 0)); transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
  .plant.ripe { animation: ripe 1.2s ease-in-out infinite; }
  @keyframes ripe { 0%, 100% { transform: scale(var(--s)); } 50% { transform: scale(calc(var(--s) * 1.12)) translateY(-6%); } }
  .drop { position: absolute; left: 50%; top: -10%; font-size: 40%; pointer-events: none; animation: drip .6s ease-in forwards; }
  @keyframes drip { from { transform: translate(-50%, -30px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-50%, 50%); opacity: 0; } }
  #fruits.nudge .fruit-btn { animation: nudge .5s ease 2; }
  @keyframes nudge { 50% { transform: translateY(-10px) scale(1.1); } }

  #lander { position: absolute; left: 8%; z-index: 19; line-height: 1; display: none; pointer-events: none; }
  #lander .rk { display: block; transform: rotate(-45deg); }
  #lander .fl { position: absolute; left: 50%; top: 80%; font-size: 55%; opacity: 0; transition: opacity .2s;
                transform: translateX(-50%) rotate(180deg); }
  #lander.firing .fl { opacity: 1; animation: flick .12s infinite alternate; }
  @keyframes flick { to { transform: translateX(-50%) rotate(180deg) scale(1.25); } }

  .flying { position: absolute; left: 0; top: 0; z-index: 26; line-height: 1; pointer-events: none;
            transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .6s; }

  /* Bottom dock: basket | fruits | rocket */
  #dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
          display: flex; align-items: center; justify-content: space-between; gap: 10px;
          padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
          background: linear-gradient(to top, rgba(5,5,16,.95), rgba(5,5,16,0)); }
  body.landed #dock { background: linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,0)); }
  .big-btn { position: relative; flex: none; width: var(--big); height: var(--big); border-radius: 50%;
             display: flex; align-items: center; justify-content: center; font-size: calc(var(--big) * .55);
             background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28);
             transition: transform .12s, box-shadow .3s, border-color .3s; }
  #fruits { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  @media (max-width: 600px) { #fruits { max-width: calc(4 * var(--fb) + 3 * 8px); } }
  .fruit-btn { width: var(--fb); height: var(--fb); border-radius: 50%; font-size: calc(var(--fb) * .6);
               display: flex; align-items: center; justify-content: center; line-height: 1;
               background: rgba(255,255,255,.12); border: 2px solid transparent; transition: transform .12s; }
  .pressed { transform: scale(.85); border-color: rgba(255,255,255,.6) !important; }

  /* Top-left buttons: find-the-planet + sticker book */
  #quiz { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 8px; z-index: 25; }
  #quiz:not(.active):not(.pressed) { animation: wiggle 5s ease-in-out infinite; }
  @keyframes wiggle { 0%, 88%, 100% { transform: rotate(0); } 91% { transform: rotate(-14deg); }
                      94% { transform: rotate(14deg); } 97% { transform: rotate(-8deg); } }
  #quiz.active { border-color: #ffd54f; box-shadow: 0 0 20px rgba(255,213,79,.7); }
  body.landed #quiz { display: none; }
  #stars-won { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px;
               font-size: 16px; letter-spacing: 2px; white-space: nowrap; pointer-events: none; }
  #book-btn { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: calc(18px + var(--big)); z-index: 25; }
  #book-btn.new::after { content: ''; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
                         border-radius: 50%; background: #ff4757; box-shadow: 0 0 8px #ff4757; }
  #toast { position: absolute; top: calc(18px + var(--big) + env(safe-area-inset-top)); left: 12px; z-index: 31;
           padding: 8px 16px; border-radius: 20px; background: rgba(255,213,79,.95); color: #3a2a00;
           font-weight: 800; font-size: 16px; pointer-events: none; opacity: 0; transform: translateY(-8px);
           transition: opacity .3s, transform .3s; }
  #toast.show { opacity: 1; transform: translateY(0); }

  #badge { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; padding: 0 6px;
           border-radius: 12px; background: #ff4757; font-size: 13px; font-weight: 700;
           display: flex; align-items: center; justify-content: center; transform: scale(0);
           transition: transform .2s; pointer-events: none; }
  #badge.show { transform: scale(1); }
  #tray { position: absolute; left: 12px; z-index: 21; display: flex; flex-wrap: wrap; gap: 2px;
          max-width: 150px; font-size: 22px; pointer-events: none; }
  #tray span { animation: drop .35s ease backwards; }
  @keyframes drop { from { transform: translateY(-20px) scale(0); opacity: 0; } }

  #banner { position: absolute; top: calc(44px + env(safe-area-inset-top)); left: 50%; z-index: 30;
            width: max-content; max-width: 70vw; text-align: center; pointer-events: none; opacity: 0;
            transform: translate(-50%, -10px) scale(.8); transition: opacity .3s, transform .3s; }
  #banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #btitle { font-size: clamp(26px, 6.5vw, 56px); font-weight: 800; letter-spacing: 3px;
            text-transform: uppercase; text-shadow: 0 0 20px rgba(120,160,255,.9); }
  #bsub { margin-top: 4px; font-size: clamp(15px, 3vw, 22px); color: rgba(255,255,255,.9);
          text-shadow: 0 2px 8px rgba(0,0,0,.8); }

  #hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
          font-size: 12px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;
          color: rgba(255,255,255,.45); pointer-events: none; transition: opacity 1s; }

  #gear { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; z-index: 25;
          width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
          font-size: 26px; opacity: .35; }

  /* ---------- Sticker book ---------- */
  #book { position: absolute; inset: 0; z-index: 45; display: none; flex-direction: column; align-items: center;
          justify-content: center; gap: 16px; padding: 20px; background: rgba(5,5,16,.97); overflow-y: auto; }
  #book.show { display: flex; }
  #book h2 { font-size: clamp(22px, 5vw, 36px); letter-spacing: 3px; text-align: center; }
  #book h2 small { display: block; font-size: 55%; font-weight: 600; color: #ffd54f; margin-top: 4px; }
  .shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: min(560px, 94vw); }
  @media (min-width: 900px) { .shelf { grid-template-columns: repeat(8, 1fr); width: min(960px, 94vw); } }
  .sticker { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px;
             border-radius: 18px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.15); }
  .sticker .pic { position: relative; width: 48px; height: 48px; font-size: 40px; line-height: 48px; text-align: center; }
  .sticker .pic .ball { position: absolute; inset: 4px; width: auto; height: auto; }
  .sticker .name { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .sticker.locked .pic { filter: grayscale(1) brightness(.3); }
  .sticker.locked .name { opacity: .3; }
  .sticker:not(.locked) { border-color: rgba(255,213,79,.6); }
  #book-close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; }

  #grownups { position: absolute; inset: 0; z-index: 50; display: none; align-items: center;
              justify-content: center; background: rgba(5,5,16,.94); }
  #grownups.show { display: flex; }
  .panel { display: flex; flex-direction: column; gap: 12px; min-width: 260px; padding: 24px;
           border-radius: 28px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
  .panel button { height: 54px; border: none; border-radius: 27px; font-size: 18px; font-weight: 600;
                  color: #fff; background: rgba(255,255,255,.12); cursor: pointer; }
  .panel button:active { background: rgba(255,255,255,.25); }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="space"><div id="sun"></div></div>

  <div id="surface">
    <div id="ground"></div>
    <div id="plots"></div>
    <div id="lander"><span class="rk">🚀</span><span class="fl">🔥</span></div>
  </div>

  <canvas id="confetti"></canvas>

  <div id="hint">tap planets, fruits, rocket, 🔭 &amp; 📒</div>
  <div id="banner"><div id="btitle"></div><div id="bsub"></div></div>
  <div class="big-btn" id="quiz">🔭<div id="stars-won"></div></div>
  <div class="big-btn" id="book-btn">📒</div>
  <div id="toast"></div>
  <div id="gear">⚙️</div>
  <div id="flyer">🚀</div>
  <div id="tray"></div>

  <div id="dock">
    <div class="big-btn" id="basket">🧺<div id="badge">0</div></div>
    <div id="fruits"></div>
    <div class="big-btn" id="rocket">🚀</div>
  </div>

  <div id="book">
    <div class="big-btn" id="book-close">✖️</div>
    <h2>My Stickers<small id="book-count"></small></h2>
    <div class="shelf" id="shelf-planets"></div>
    <div class="shelf" id="shelf-fruits"></div>
  </div>

  <div id="grownups">
    <div class="panel">
      <button id="btn-clear">Clear everything</button>
      <button id="btn-sound">Sound: On</button>
      <button id="btn-calm">Calm mode: Off</button>
      <button id="btn-stickers">Reset stickers</button>
      <button id="btn-close">Close</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const PLANETS = [
    { name: 'Mercury', fact: 'Mercury is closest to the Sun.', rel: .55, speed: .90, ground: '#a8a8a8', ground2: '#5a5a5a', sky: '#1d1d2b',
      bg: 'radial-gradient(circle at 35% 35%, #e0e0e0, #9e9e9e 60%, #616161)' },
    { name: 'Venus',   fact: 'Venus is the hottest planet.',   rel: .80, speed: .65, ground: '#e0b866', ground2: '#9a6b25', sky: '#5a3d14',
      bg: 'radial-gradient(circle at 35% 35%, #fff3c4, #e8c27a 55%, #b8893a)' },
    { name: 'Earth',   fact: 'Earth is our home!',             rel: .85, speed: .50, ground: '#5cbf4f', ground2: '#2e7d32', sky: '#1e5a9a',
      bg: 'radial-gradient(circle at 30% 30%, #7fd36b 0 18%, transparent 19%), radial-gradient(circle at 65% 62%, #5cbf4f 0 16%, transparent 17%), radial-gradient(circle at 35% 35%, #6ec6ff, #1e88e5 60%, #0d47a1)' },
    { name: 'Mars',    fact: 'Mars is the red planet.',        rel: .65, speed: .40, ground: '#d2603f', ground2: '#7a2a12', sky: '#6a2a18',
      bg: 'radial-gradient(circle at 35% 35%, #ffab91, #e2583e 55%, #8d2a14)' },
    { name: 'Jupiter', fact: 'Jupiter is the biggest planet.', rel: 1.5, speed: .25, ground: '#d9a46c', ground2: '#8a5a30', sky: '#5a3a22',
      bg: 'linear-gradient(180deg, #e9d3b0 0 15%, #c98f5b 15% 28%, #f1e2c6 28% 42%, #b9733f 42% 55%, #ecdcc0 55% 70%, #c98f5b 70% 82%, #e9d3b0 82%)' },
    { name: 'Saturn',  fact: 'Saturn has beautiful rings.',    rel: 1.25, speed: .18, ring: true, ground: '#e6c983', ground2: '#a0803e', sky: '#4f4222',
      bg: 'linear-gradient(180deg, #f3e3b5 0 30%, #e0c27f 30% 50%, #f3e3b5 50% 70%, #d9b56a 70%)' },
    { name: 'Uranus',  fact: 'Uranus spins on its side.',      rel: 1.0, speed: .12, ground: '#8fe3ea', ground2: '#3a9aa6', sky: '#164a52',
      bg: 'radial-gradient(circle at 35% 35%, #e0ffff, #8fe3ea 55%, #3fa7b5)' },
    { name: 'Neptune', fact: 'Neptune is cold and windy.',     rel: 1.0, speed: .09, ground: '#5a82ea', ground2: '#1f3a9a', sky: '#121f52',
      bg: 'radial-gradient(circle at 35% 35%, #9fb8ff, #3f6fe0 55%, #1a2f8a)' },
  ];

  const FRUITS = [
    { e: '🍎', name: 'Apple',      color: 'Red',    f: 523 },
    { e: '🍌', name: 'Banana',     color: 'Yellow', f: 587 },
    { e: '🍇', name: 'Grapes',     color: 'Purple', f: 659 },
    { e: '🍊', name: 'Orange',     color: 'Orange', f: 698 },
    { e: '🥦', name: 'Broccoli',   color: 'Green',  f: 784 },
    { e: '🥕', name: 'Carrot',     color: 'Orange', f: 880 },
    { e: '🍓', name: 'Strawberry', color: 'Red',    f: 988 },
    { e: '🍍', name: 'Pineapple',  color: 'Yellow', f: 1047 },
  ];
  const phrase = (d) => d.name === d.color ? d.name : `${d.color} ${d.name.toLowerCase()}`;

  const MAX_FRUITS = 12;
  const QUIZ_ROUND = 3;              // planets to find before the big celebration
  const PLOTS = 4;                   // garden spots on each planet
  const STAGE_AT = [0, 1.2, 2.4, 3.6]; // seconds: seed, sprout, leaves, fruit

  const $ = (id) => document.getElementById(id);
  const space = $('space'), sun = $('sun'), dock = $('dock'), basket = $('basket'), badge = $('badge'),
        tray = $('tray'), rocketBtn = $('rocket'), flyer = $('flyer'), banner = $('banner'), gear = $('gear'),
        quizBtn = $('quiz'), starsWon = $('stars-won'), surface = $('surface'), ground = $('ground'),
        plotsBox = $('plots'), lander = $('lander'), fruitBox = $('fruits'), bookBtn = $('book-btn');

  /* ---------- Saved settings + stickers ---------- */
  const STORE_KEY = 'space-garden';
  const store = (() => {
    const fresh = { planets: [], fruits: [], calm: false, sound: true };
    try { return Object.assign(fresh, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch { return fresh; }
  })();
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {} };

  /* ---------- Sound: synth tones + spoken words ---------- */
  let ctx = null;
  function unlockAudio() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, { type = 'triangle', dur = .35, vol = .25, to = null } = {}) {
    if (!store.sound || !ctx) return;
    if (store.calm) vol *= .5;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * .8);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const jingle = (notes, gap = 120) => notes.forEach((f, i) => setTimeout(() => tone(f, { dur: .3 }), i * gap));
  function say(text) {
    if (!store.sound || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = store.calm ? .75 : .85; u.pitch = 1.25; u.volume = store.calm ? .7 : 1;
    speechSynthesis.speak(u);
  }

  /* First touch: wake up audio/speech (needed on phones) and go full screen on Android */
  let firstTouch = true;
  document.addEventListener('pointerup', () => {
    unlockAudio();
    if (!firstTouch) return;
    firstTouch = false;
    const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
    const el = document.documentElement;
    if (!installed && matchMedia('(pointer: coarse)').matches && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }, true);

  /* ---------- Touch helpers ---------- */
  function press(el) { el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 150); }
  function boop(el) { el.classList.remove('boop'); void el.offsetWidth; el.classList.add('boop'); }
  function onTap(el, fn) {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); fn(e); });
  }
  function onPress(el, { tap, hold, ms = 700 }) {
    let timer = null, held = false;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation(); unlockAudio();
      held = false; el.classList.add('pressed');
      timer = setTimeout(() => { held = true; if (hold) hold(); }, ms);
    });
    const end = (fire) => () => {
      if (timer === null) return;
      clearTimeout(timer); timer = null; el.classList.remove('pressed');
      if (fire && !held && tap) tap();
    };
    el.addEventListener('pointerup', end(true));
    el.addEventListener('pointerleave', end(false));
    el.addEventListener('pointercancel', end(false));
  }
  const setPos = (el, x, y, extra = '') => { el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) ${extra}`; };
  const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const center = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

  /* ---------- Banner + toast ---------- */
  let bannerTimer = null;
  function showBanner(title, sub = '', ms = 2400) {
    $('btitle').textContent = title;
    $('bsub').textContent = sub;
    banner.classList.add('show');
    clearTimeout(bannerTimer);
    if (ms) bannerTimer = setTimeout(() => banner.classList.remove('show'), ms);
  }
  function hideBanner() { clearTimeout(bannerTimer); banner.classList.remove('show'); }
  let toastTimer = null;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- Confetti ---------- */
  const cv = $('confetti'), cctx = cv.getContext('2d');
  const COLORS = ['#ff4757', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3', '#ffffff', '#ff9f43'];
  const DIRT = ['#8d6e63', '#6d4c41', '#a1887f', '#5d4037'];
  const bits = [];
  function confetti(x, y, n = 40, power = 1, colors = COLORS) {
    if (store.calm) n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (120 + Math.random() * 320) * power;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 160 * power, age: 0, life: 1 + Math.random() * .9,
                  size: 4 + Math.random() * 5, color: colors[(Math.random() * colors.length) | 0],
                  rot: Math.random() * 6, vr: (Math.random() - .5) * 12, round: Math.random() < .35 });
    }
  }
  function celebrate() {
    for (let i = 0; i < 7; i++) setTimeout(() => confetti(W * (.15 + Math.random() * .7), H * (.15 + Math.random() * .45), 60, 1.2), i * 220);
    jingle([523, 659, 784, 1047, 784, 1047], 140);
  }
  let hadBits = false;
  function updateConfetti(dt) {
    if (!bits.length && !hadBits) return;
    cctx.clearRect(0, 0, W, H);
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.age += dt;
      if (b.age >= b.life) { bits.splice(i, 1); continue; }
      b.vy += 520 * dt; b.vx *= .985;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      cctx.globalAlpha = 1 - b.age / b.life;
      cctx.fillStyle = b.color;
      cctx.save();
      cctx.translate(b.x, b.y); cctx.rotate(b.rot);
      if (b.round) { cctx.beginPath(); cctx.arc(0, 0, b.size / 2, 0, Math.PI * 2); cctx.fill(); }
      else cctx.fillRect(-b.size / 2, -b.size / 4, b.size, b.size / 2);
      cctx.restore();
    }
    cctx.globalAlpha = 1;
    hadBits = bits.length > 0;
  }

  /* ---------- Stickers ---------- */
  const TOTAL_STICKERS = PLANETS.length + FRUITS.length;
  const stickerCount = () => store.planets.length + store.fruits.length;
  function unlock(kind, name, label) {
    if (store[kind].includes(name)) return;
    store[kind].push(name);
    save();
    bookBtn.classList.add('new');
    boop(bookBtn);
    toast(`New sticker! ${label}`);
    setTimeout(() => jingle([1047, 1319, 1568], 90), 300);
    if (stickerCount() === TOTAL_STICKERS) {
      setTimeout(() => { celebrate(); showBanner('All stickers! 🏆', 'You are a space star!', 3500); say('Wow! You got all the stickers!'); }, 2500);
    }
  }

  function renderBook() {
    $('book-count').textContent = `${stickerCount()} of ${TOTAL_STICKERS} ⭐`;
    const sp = $('shelf-planets'), sf = $('shelf-fruits');
    sp.innerHTML = ''; sf.innerHTML = '';
    PLANETS.forEach((p) => {
      const have = store.planets.includes(p.name);
      const el = document.createElement('div');
      el.className = 'sticker' + (have ? '' : ' locked');
      el.innerHTML = `<div class="pic"><div class="ball" style="background:${p.bg}"></div>${p.ring ? '<div class="sring"></div>' : ''}</div><div class="name">${have ? p.name : '?'}</div>`;
      onTap(el, () => {
        boop(el.firstChild);
        say(have ? `${p.name}! ${p.fact}` : `Fly the rocket to ${p.name} to get this sticker!`);
      });
      sp.appendChild(el);
    });
    FRUITS.forEach((d) => {
      const have = store.fruits.includes(d.name);
      const el = document.createElement('div');
      el.className = 'sticker' + (have ? '' : ' locked');
      el.innerHTML = `<div class="pic">${d.e}</div><div class="name">${have ? d.name : '?'}</div>`;
      onTap(el, () => {
        boop(el.firstChild);
        say(have ? phrase(d) + '!' : `Pick the ${d.name.toLowerCase()} to get this sticker!`);
      });
      sf.appendChild(el);
    });
  }
  onTap(bookBtn, () => {
    press(bookBtn);
    bookBtn.classList.remove('new');
    renderBook();
    $('book').classList.add('show');
    say(`My stickers! You have ${stickerCount()}.`);
  });
  onTap($('book-close'), () => { $('book').classList.remove('show'); });

  /* ---------- Stars ---------- */
  const sky = $('sky');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    const size = Math.random() * 2.2 + .8;
    s.className = 'star';
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;--d:${1.5 + Math.random() * 3}s`;
    sky.appendChild(s);
  }

  /* ---------- Scene: 'space' | 'landing' | 'planet' | 'takeoff' ---------- */
  let scene = 'space';
  let current = null; // planet we're standing on

  /* ---------- Planets ---------- */
  const rings = [];
  const planets = PLANETS.map((d, i) => {
    const ring = document.createElement('div');
    ring.className = 'ring';
    space.appendChild(ring);
    rings.push(ring);

    const el = document.createElement('div');
    el.className = 'body planet';
    el.innerHTML = `<div class="inner"><div class="ball" style="background:${d.bg}"></div>${d.ring ? '<div class="sring"></div>' : ''}</div><div class="label">${d.name}</div>`;
    space.appendChild(el);

    const p = { ...d, i, el, inner: el.querySelector('.inner'), a: Math.random() * Math.PI * 2, x: 0, y: 0, rx: 0, ry: 0,
                garden: Array(PLOTS).fill(null) };
    onTap(el, () => {
      if (scene !== 'space') return;
      if (quiz.active) { quizAnswer(p); return; }
      boop(p.inner);
      showBanner(p.name, p.fact);
      say(`${p.name}! ${p.fact}`);
      tone(200 + i * 60, { type: 'sine', dur: .5, vol: .2 });
    });
    return p;
  });

  /* ---------- Find-the-planet game ---------- */
  const quiz = { active: false, target: null, last: null, wrong: 0, found: 0, timer: null };

  function askQuestion() {
    let p;
    do { p = planets[(Math.random() * planets.length) | 0]; } while (p === quiz.last);
    Object.assign(quiz, { target: p, last: p, wrong: 0 });
    showBanner(`Where's ${p.name}?`, 'Tap it!', 0);
    say(`Where's ${p.name}?`);
  }
  function startQuiz() {
    Object.assign(quiz, { active: true, found: 0, last: null });
    quizBtn.classList.add('active');
    starsWon.textContent = '';
    jingle([392, 523]);
    askQuestion();
  }
  function stopQuiz() {
    clearTimeout(quiz.timer);
    if (quiz.target) quiz.target.el.classList.remove('glow');
    if (quiz.active) hideBanner();
    Object.assign(quiz, { active: false, target: null });
    quizBtn.classList.remove('active');
    starsWon.textContent = '';
  }
  function quizAnswer(p) {
    boop(p.inner);
    const target = quiz.target;
    if (!target) return; // between questions
    if (p === target) {
      p.el.classList.remove('glow');
      quiz.target = null;
      quiz.found++;
      starsWon.textContent = '⭐'.repeat(quiz.found);
      confetti(p.x, p.y, 50);
      jingle([523, 659, 784]);
      showBanner('Yes! ⭐', `That's ${p.name}!`, 0);
      say(`Yes! That's ${p.name}!`);
      unlock('planets', p.name, p.name);
      if (quiz.found >= QUIZ_ROUND) {
        quiz.timer = setTimeout(() => {
          celebrate();
          showBanner('Super star! 🌟', `You found ${QUIZ_ROUND} planets!`, 3500);
          say(`Super star! You found ${QUIZ_ROUND} planets!`);
          quiz.timer = setTimeout(stopQuiz, 3600);
        }, 1800);
      } else {
        quiz.timer = setTimeout(askQuestion, 2200);
      }
    } else {
      quiz.wrong++;
      tone(260, { type: 'sine', to: 200, dur: .3, vol: .15 });
      say(`That's ${p.name}. Where's ${target.name}?`);
      showBanner(`Where's ${target.name}?`, `That one is ${p.name}`, 0);
      if (quiz.wrong >= 2) target.el.classList.add('glow'); // help after two tries
    }
  }
  onTap(quizBtn, () => { press(quizBtn); quiz.active ? stopQuiz() : startQuiz(); });

  /* ---------- Garden plots on the planet surface ---------- */
  const plots = [];
  for (let i = 0; i < PLOTS; i++) {
    const el = document.createElement('div');
    el.className = 'plot';
    el.innerHTML = '<div class="mound"></div><div class="plant"></div>';
    plotsBox.appendChild(el);
    plots.push({ el, plant: el.querySelector('.plant') });
    onTap(el, () => tapPlot(i));
  }
  const stageOf = (t) => t >= STAGE_AT[3] ? 3 : t >= STAGE_AT[2] ? 2 : t >= STAGE_AT[1] ? 1 : 0;
  const STAGE_LOOK = [{ e: '🌱', s: .45 }, { e: '🌱', s: .85 }, { e: '🌿', s: 1 }];

  function renderSlot(i) {
    const s = current && current.garden[i], plant = plots[i].plant;
    if (!s) { plant.style.setProperty('--s', 0); plant.classList.remove('ripe'); return; }
    const ripe = s.stage === 3;
    plant.textContent = ripe ? s.d.e : STAGE_LOOK[s.stage].e;
    plant.style.setProperty('--s', ripe ? 1.1 : STAGE_LOOK[s.stage].s);
    plant.classList.toggle('ripe', ripe);
  }
  const renderGarden = () => plots.forEach((_, i) => renderSlot(i));

  function setStage(i, s, stage) {
    if (stage === s.stage) return;
    s.stage = stage;
    renderSlot(i);
    if (stage === 3) {
      const c = center(plots[i].el);
      confetti(c.x, c.y - 30, 16, .5);
      jingle([784, 1047], 90);
    }
  }

  function plant(d, btn) {
    const i = current.garden.findIndex((s) => !s);
    if (i < 0) {
      tone(180, { dur: .2, vol: .15 });
      say('The garden is full! Tap a fruit to pick it.');
      return;
    }
    current.garden[i] = { d, t: 0, stage: 0 };
    renderSlot(i);
    const c = center(plots[i].el);
    confetti(c.x, c.y + 10, 14, .4, DIRT);
    tone(d.f, { dur: .25 });
    say(`Plant the ${phrase(d)}!`);
  }

  function tapPlot(i) {
    if (scene !== 'planet') return;
    const s = current.garden[i];
    if (!s) {
      say('Tap a fruit to plant it!');
      fruitBox.classList.remove('nudge'); void fruitBox.offsetWidth; fruitBox.classList.add('nudge');
      return;
    }
    if (s.stage < 3) { // water it: grows to the next step right away
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.textContent = '💧';
      plots[i].el.appendChild(drop);
      setTimeout(() => drop.remove(), 650);
      tone(900, { type: 'sine', to: 400, dur: .25, vol: .18 });
      s.t = Math.max(s.t, STAGE_AT[s.stage + 1]);
      setStage(i, s, stageOf(s.t));
      return;
    }
    harvest(i);
  }

  function harvest(i) {
    const s = current.garden[i];
    current.garden[i] = null;
    renderSlot(i);
    const from = center(plots[i].plant), to = center(basket);
    const fly = document.createElement('div');
    fly.className = 'flying';
    fly.textContent = s.d.e;
    fly.style.fontSize = getComputedStyle(plotsBox).fontSize;
    document.body.appendChild(fly);
    setPos(fly, from.x, from.y);
    void fly.offsetWidth;
    setPos(fly, to.x, to.y, 'scale(.5)');
    tone(s.d.f, { to: s.d.f / 2, dur: .5 });
    setTimeout(() => { fly.remove(); collectItem(s.d, to.x, to.y); }, 620);
  }

  function updateGarden(dt) {
    if (scene !== 'planet') return;
    current.garden.forEach((s, i) => {
      if (!s || s.stage === 3) return;
      s.t += dt * (store.calm ? .7 : 1);
      setStage(i, s, stageOf(s.t));
    });
  }

  /* ---------- Landing + take-off ---------- */
  function clearSky() {
    meteors.forEach((m) => m.el.remove()); meteors.length = 0;
    ufo.on = false; ufoEl.style.display = 'none';
  }

  function land(p) {
    scene = 'landing';
    current = p;
    stopQuiz();
    clearSky();
    surface.style.setProperty('--ground', p.ground);
    surface.style.setProperty('--ground2', p.ground2);
    surface.style.setProperty('--sky', p.sky);
    renderGarden();
    document.body.classList.add('landed');
    surface.classList.add('show');
    layoutSurface();

    lander.style.transition = 'none';
    lander.style.transform = 'translateY(-120vh)';
    lander.style.display = 'block';
    lander.classList.add('firing');
    void lander.offsetWidth;
    lander.style.transition = 'transform 1.4s cubic-bezier(.2,.8,.3,1)';
    lander.style.transform = 'translateY(0)';
    tone(700, { type: 'sawtooth', to: 150, dur: 1.3, vol: .08 });

    setTimeout(() => {
      lander.classList.remove('firing');
      tone(110, { type: 'sine', dur: .35, vol: .3 });
      const c = center(lander);
      confetti(c.x, c.y + 20, 24, .6, DIRT);
      showBanner(p.name, p.fact, 3500);
      say(`We landed on ${p.name}! ${p.fact} Let's plant some fruit!`);
      unlock('planets', p.name, p.name);
      scene = 'planet';
    }, 1450);
  }

  function takeOff() {
    scene = 'takeoff';
    lander.classList.add('firing');
    lander.style.transition = 'transform 1.1s cubic-bezier(.6,0,.9,.4)';
    lander.style.transform = 'translateY(-120vh)';
    tone(150, { type: 'sawtooth', dur: 1, vol: .1, to: 700 });
    say('Blast off! Back to space!');
    setTimeout(() => {
      surface.classList.remove('show');
      document.body.classList.remove('landed');
      hideBanner();
    }, 700);
    setTimeout(() => {
      lander.style.display = 'none';
      lander.classList.remove('firing');
      scene = 'space';
      current = null;
    }, 1300);
  }

  /* ---------- Layout (fits any screen) ---------- */
  let W, H, cx, cy, Rx, Ry, sunR, fruitSize;
  function layoutSurface() {
    const dockH = dock.offsetHeight;
    const plotSize = Math.max(64, Math.min(130, W / 5.2));
    plotsBox.style.bottom = dockH + 6 + 'px';
    plotsBox.style.fontSize = plotSize * .62 + 'px';
    plots.forEach((p) => { p.el.style.width = plotSize + 'px'; p.el.style.height = plotSize * 1.1 + 'px'; });
    const groundH = Math.max(H * .42, dockH + plotSize * 1.1 + 70);
    ground.style.height = groundH + 'px';
    lander.style.fontSize = plotSize * .8 + 'px';
    lander.style.bottom = groundH - 26 + 'px';
  }

  function layout() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const top = 36, availH = Math.max(200, H - dock.offsetHeight - top - 6);
    cx = W / 2; cy = top + availH / 2;

    const base = Math.max(14, Math.min(42, Math.min(W / 2, availH / 2) / 8));
    const margin = base * .9 + 10;
    let rx = W / 2 - margin, ry = availH / 2 - margin;
    rx = Math.min(rx, ry * 1.7); ry = Math.min(ry, rx * 1.7);
    Rx = rx; Ry = ry;

    const m = Math.min(rx, ry);
    sunR = Math.max(18, Math.min(60, m * .14));
    sun.style.width = sun.style.height = sunR * 2 + 'px';
    sun.style.left = cx + 'px'; sun.style.top = cy + 'px';

    const innerR = sunR + base * .9 + 6;
    planets.forEach((p, i) => {
      const k = i / (planets.length - 1);
      p.rx = innerR + (rx - innerR) * k;
      p.ry = innerR + (ry - innerR) * k;
      const size = Math.max(14, base * p.rel);
      p.el.style.width = p.el.style.height = size + 'px';
      Object.assign(rings[i].style, { left: cx + 'px', top: cy + 'px', width: p.rx * 2 + 'px', height: p.ry * 2 + 'px' });
    });

    fruitSize = Math.max(28, Math.min(48, m / 6));
    fruits.forEach(sizeFruit);
    tray.style.bottom = dock.offsetHeight + 4 + 'px';
    layoutSurface();
  }

  /* ---------- Fruits in orbit ---------- */
  const fruits = [];
  function sizeFruit(f) {
    f.rx = Rx * f.frac; f.ry = Ry * f.frac;
    f.el.style.width = f.el.style.height = fruitSize + 'px';
    f.el.style.fontSize = fruitSize * .8 + 'px';
  }

  function launchFruit(d, btn) {
    if (fruits.filter((f) => f.state !== 'fall').length >= MAX_FRUITS) { tone(180, { dur: .2, vol: .15 }); return; }
    const el = document.createElement('div');
    el.className = 'body fruit';
    el.innerHTML = `<div class="inner">${d.e}</div>`;
    space.appendChild(el);

    const start = center(btn);
    const f = { ...d, el, inner: el.querySelector('.inner'), state: 'launch', t: 0, sx: start.x, sy: start.y,
                a: Math.random() * Math.PI * 2, speed: .35 + Math.random() * .4, frac: .3 + Math.random() * .7 };
    sizeFruit(f);
    setPos(el, f.sx, f.sy);
    fruits.push(f);

    onTap(el, () => { if (f.state === 'fall' || scene !== 'space') return; boop(f.inner); say(phrase(f) + '!'); tone(f.f); });
    say(phrase(d) + '!');
    tone(d.f);
  }

  FRUITS.forEach((d) => {
    const b = document.createElement('div');
    b.className = 'fruit-btn';
    b.textContent = d.e;
    fruitBox.appendChild(b);
    onTap(b, () => {
      press(b);
      if (scene === 'planet') plant(d, b);
      else if (scene === 'space') launchFruit(d, b);
    });
  });

  /* ---------- Basket: tap = bring a fruit down / pick a ripe one, hold = empty ---------- */
  let count = 0;
  function updateBadge() { badge.textContent = count; badge.classList.toggle('show', count > 0); }

  function collectItem(d, x, y) {
    count++; updateBadge(); boop(basket);
    confetti(x, y - 20, 14, .5);
    const s = document.createElement('span');
    s.textContent = d.e;
    tray.appendChild(s);
    while (tray.children.length > 12) tray.firstChild.remove();
    say(phrase(d) + '!');
    unlock('fruits', d.name, d.e);
  }

  function pullFruit() {
    const f = fruits.find((x) => x.state === 'orbit' || x.state === 'launch');
    if (!f) { tone(220, { dur: .15, vol: .12 }); return; }
    const to = center(basket);
    Object.assign(f, { state: 'fall', t: 0, sx: f.x, sy: f.y, tx: to.x, ty: to.y });
    tone(f.f, { to: f.f / 2, dur: .5 });
  }
  function emptyBasket() {
    tray.innerHTML = ''; count = 0; updateBadge();
    tone(600, { to: 200, dur: .4 });
  }
  onPress(basket, {
    tap: () => {
      if (scene === 'space') pullFruit();
      else if (scene === 'planet') {
        const i = current.garden.findIndex((s) => s && s.stage === 3);
        if (i >= 0) harvest(i); else tone(220, { dur: .15, vol: .12 });
      }
    },
    hold: emptyBasket,
  });

  /* ---------- Rocket: in space it flies to the next planet and lands; on a planet it takes off ---------- */
  let flight = null, nextPlanet = 0;
  onTap(rocketBtn, () => {
    press(rocketBtn);
    if (scene === 'planet') { takeOff(); return; }
    if (scene !== 'space' || flight) return;
    const p = planets[nextPlanet];
    nextPlanet = (nextPlanet + 1) % planets.length;
    const s = center(rocketBtn);
    flight = { p, sx: s.x, sy: s.y, px: s.x, py: s.y, t: 0, rot: -45 };
    flyer.style.opacity = '1';
    flyer.style.display = 'block';
    setPos(flyer, s.x, s.y);
    stopQuiz();
    tone(150, { type: 'sawtooth', dur: .9, vol: .1, to: 700 });
    say('Blast off! Going to ' + p.name);
  });
  function updateFlight(dt) {
    if (!flight || flight.done) return;
    flight.t = Math.min(1, flight.t + dt / 2.6);
    const e = ease(flight.t), p = flight.p;
    const x = lerp(flight.sx, p.x, e), y = lerp(flight.sy, p.y, e);
    if (Math.hypot(x - flight.px, y - flight.py) > .5) flight.rot = Math.atan2(y - flight.py, x - flight.px) * 180 / Math.PI + 45;
    flight.px = x; flight.py = y;
    setPos(flyer, x, y, `rotate(${flight.rot}deg)`);
    if (flight.t >= 1) {
      flight.done = true;
      scene = 'landing';
      boop(p.inner);
      confetti(p.x, p.y, 30);
      flyer.style.opacity = '0';
      setTimeout(() => { flyer.style.display = 'none'; flight = null; land(p); }, 450);
    }
  }

  /* ---------- Meteors ---------- */
  const meteors = [];
  let meteorWait = 2;
  function spawnMeteor() {
    const el = document.createElement('div');
    el.className = 'body meteor';
    el.textContent = '☄️';
    space.appendChild(el);
    const m = { el, x: W * (.3 + Math.random() * .8), y: -40, vx: -(60 + Math.random() * 60), vy: 110 + Math.random() * 90, dead: false };
    meteors.push(m);
    onTap(el, () => {
      if (m.dead) return;
      m.dead = true;
      el.textContent = '✨';
      el.classList.add('burst');
      confetti(m.x, m.y, 20, .6);
      tone(900, { type: 'square', to: 200, dur: .25, vol: .1 });
      setTimeout(() => { el.remove(); const i = meteors.indexOf(m); if (i > -1) meteors.splice(i, 1); }, 400);
    });
  }
  function updateMeteors(dt) {
    meteorWait -= dt;
    if (meteorWait <= 0) {
      meteorWait = 3 + Math.random() * 4;
      if (meteors.length < 3 && scene === 'space' && !store.calm) spawnMeteor();
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      if (m.dead) continue;
      m.x += m.vx * dt; m.y += m.vy * dt;
      setPos(m.el, m.x, m.y);
      if (m.y > H + 50 || m.x < -60) { m.el.remove(); meteors.splice(i, 1); }
    }
  }

  /* ---------- UFO ---------- */
  const ufoEl = document.createElement('div');
  ufoEl.className = 'body';
  ufoEl.id = 'ufo';
  ufoEl.innerHTML = '<div class="inner">🛸</div>';
  space.appendChild(ufoEl);
  const ufo = { on: false, wait: 6, x: 0, y: 0, vx: 0, vy: 0, t: 0, leaving: false };
  onTap(ufoEl, () => {
    if (!ufo.on || ufo.leaving) return;
    ufo.leaving = true; ufo.vy = -320;
    boop(ufoEl.firstChild);
    if (!quiz.active) say('Hello!');
    tone(700, { type: 'sine', to: 1400, dur: .5, vol: .15 });
  });
  function updateUFO(dt) {
    if (!ufo.on) {
      ufo.wait -= dt;
      if (ufo.wait <= 0) {
        ufo.wait = 8 + Math.random() * 8;
        if (scene !== 'space' || store.calm) return;
        const dir = Math.random() < .5 ? 1 : -1;
        Object.assign(ufo, { on: true, leaving: false, t: 0, x: dir > 0 ? -60 : W + 60, y: 70 + Math.random() * H * .25, vx: dir * (70 + Math.random() * 40), vy: 0 });
        ufoEl.style.display = 'block';
        tone(500, { type: 'sine', to: 650, dur: .6, vol: .08 });
      }
      return;
    }
    ufo.t += dt; ufo.x += ufo.vx * dt; ufo.y += ufo.vy * dt;
    setPos(ufoEl, ufo.x, ufo.y + Math.sin(ufo.t * 3) * 8);
    if (ufo.x < -80 || ufo.x > W + 80 || ufo.y < -80) { ufo.on = false; ufoEl.style.display = 'none'; }
  }

  /* ---------- Sun ---------- */
  onTap(sun, () => {
    if (scene !== 'space') return;
    boop(sun);
    if (quiz.active) { say(`That's the Sun. Where's ${quiz.target ? quiz.target.name : 'the planet'}?`); return; }
    showBanner('Sun', 'The Sun is a big, hot star!');
    say('The Sun! The Sun is a big, hot star!');
    tone(220, { type: 'sine', to: 110, dur: .5, vol: .2 });
  });

  /* ---------- Grown-ups menu (hold the gear) ---------- */
  const overlay = $('grownups'), btnSound = $('btn-sound'), btnCalm = $('btn-calm');
  const refreshButtons = () => {
    btnSound.textContent = 'Sound: ' + (store.sound ? 'On' : 'Off');
    btnCalm.textContent = 'Calm mode: ' + (store.calm ? 'On' : 'Off');
  };
  refreshButtons();
  onPress(gear, { hold: () => overlay.classList.add('show'), ms: 1000 });
  $('btn-close').addEventListener('click', () => overlay.classList.remove('show'));
  btnSound.addEventListener('click', () => {
    store.sound = !store.sound; save(); refreshButtons();
    if (!store.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
  });
  btnCalm.addEventListener('click', () => {
    store.calm = !store.calm; save(); refreshButtons();
    if (store.calm) clearSky();
  });
  $('btn-stickers').addEventListener('click', () => {
    if (!confirm('Remove all stickers?')) return;
    store.planets = []; store.fruits = []; save();
    bookBtn.classList.remove('new');
  });
  $('btn-clear').addEventListener('click', () => {
    fruits.forEach((f) => f.el.remove()); fruits.length = 0;
    planets.forEach((p) => p.garden.fill(null));
    clearSky();
    emptyBasket();
    stopQuiz();
    if (scene === 'planet') renderGarden();
    overlay.classList.remove('show');
  });

  /* ---------- Main loop ---------- */
  function updateFruits(dt) {
    for (const f of fruits) {
      if (f.state === 'fall') {
        f.t = Math.min(1, f.t + dt / .6);
        const e = ease(f.t);
        setPos(f.el, lerp(f.sx, f.tx, e), lerp(f.sy, f.ty, e), `scale(${1 - e * .5})`);
        if (f.t >= 1) {
          f.el.remove();
          fruits.splice(fruits.indexOf(f), 1);
          collectItem(f, f.tx, f.ty);
          return; // array changed; continue next frame
        }
        continue;
      }
      f.a += f.speed * dt;
      const ox = cx + Math.cos(f.a) * f.rx, oy = cy + Math.sin(f.a) * f.ry;
      if (f.state === 'launch') {
        f.t = Math.min(1, f.t + dt / .7);
        const e = ease(f.t);
        f.x = lerp(f.sx, ox, e); f.y = lerp(f.sy, oy, e);
        if (f.t >= 1) f.state = 'orbit';
      } else {
        f.x = ox; f.y = oy;
      }
      setPos(f.el, f.x, f.y);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    const slow = store.calm ? .5 : 1;
    for (const p of planets) {
      p.a += p.speed * .35 * dt * slow;
      p.x = cx + Math.cos(p.a) * p.rx;
      p.y = cy + Math.sin(p.a) * p.ry;
      setPos(p.el, p.x, p.y);
    }
    updateFruits(dt * slow);
    updateFlight(dt);
    updateMeteors(dt);
    updateUFO(dt);
    updateGarden(dt);
    updateConfetti(dt);
    requestAnimationFrame(frame);
  }

  addEventListener('resize', layout);
  layout();
  requestAnimationFrame(frame);
  setTimeout(() => { $('hint').style.opacity = '0'; }, 8000);

  /* ---------- Offline / installable app ---------- */
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
